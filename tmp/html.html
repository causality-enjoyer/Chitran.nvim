<html>
  <head>
    <meta charset="utf-8" />
    <title>${escapeHtml(name)}</title>
    <style>
      body {
        font-family: ui-monospace, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .l.cur {
        background: rgba(255, 200, 0, 0.18);
        box-shadow: -3px 0 0 #fc0;
      }
    </style>
  </head>

  <body>
    ${renderRaw(text)}

    <script>
      const BUF = ${JSON.stringify(id)};
      let current = null;
      const es = new EventSource("/event/" + BUF);
      es.addEventListener("cursor", (e) => {
      	const { line } = JSON.parse(e.data);
      	let el = null;
      	for (let n = line; n >= 1 && !el; n--) {
      		el = document.querySelector('[data-line="' + n + '"]');
      		if (!el) return;
      		current?.classList.remove("cur");
      		el.classList.add("cur");
      		current = el;
      		const r = el.getBoundingClientRect();
      		const h = window.innerHeight;
      		if (r.top < h * 0.25 || r.bottom > h * 0.75) {
      			el.scrollIntoView({ block: "center", behavior: "smooth" });
      		}
      	}
      })
    </script>
  </body>
</html>
